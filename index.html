<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/Logo%20Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get("view") !== "proposal") return;

          var robots = document.createElement("meta");
          robots.name = "robots";
          robots.content = "noindex, nofollow";
          document.head.appendChild(robots);

          var googlebot = document.createElement("meta");
          googlebot.name = "googlebot";
          googlebot.content = "noindex, nofollow";
          document.head.appendChild(googlebot);
        } catch (error) {
          // Keep proposal pages usable even if URLSearchParams is unavailable.
        }
      })();
    </script>
    <!-- route-meta:start -->
    <meta
      name="description"
      content="Zumetrix Labs builds SaaS products, rescues stuck ones and automates manual operations — founder-led by Zia Hussain and Omer Gillani, with 60+ shipped projects and 80+ written client reviews."
    />
    <meta name="author" content="Zumetrix Labs" />
    <meta
      property="og:title"
      content="Zumetrix Labs — SaaS products, product rescue and automation, founder-led"
    />
    <meta
      property="og:description"
      content="SaaS products, product rescue and automation, founder-led — 60+ shipped projects, 80+ written client reviews."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zumetrix.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Zumetrix Labs — SaaS products, product rescue and automation, founder-led"
    />
    <meta
      name="twitter:description"
      content="SaaS products, product rescue and automation, founder-led — 60+ shipped projects, 80+ written client reviews."
    />
    <link rel="canonical" href="https://zumetrix.com" />
    <title>Zumetrix Labs — SaaS products, product rescue and automation, founder-led</title>
    <!-- route-meta:end -->
    <!-- Organization JSON-LD lives only in HomePage.tsx's structuredData now.
         This file used to ship a second, slightly different Organization
         block (different logo shape, an extra address field, a shorter
         sameAs list) unconditionally on every route — including the home
         page, which already declares its own. Two conflicting definitions
         of the same @id on one document is worse than one correct one. -->
    <!-- Microsoft Clarity removed 2026-10-23 (Phase 1 closure). The tag
         "p5j8k9m0n1" was added on 2025-11-22 with no record of a project;
         clarity.ms returned an empty 204 for it on production (no script
         body, no cookies, no data was ever collected). Session replay can
         be reintroduced deliberately later with a real project id. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
