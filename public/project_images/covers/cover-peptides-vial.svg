<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="vl-key" cx="30%" cy="16%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="vl-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vl-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="vl-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="vl-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vl-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="vl-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="vl-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="vl-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="vl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="vl-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vl-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vl-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="vl-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="vl-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="vl-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#vl-clip)">
    <rect width="1200" height="900" fill="url(#vl-key)"/>
    <rect width="1200" height="900" fill="url(#vl-warm)"/>

    <ellipse cx="600" cy="800" rx="230" ry="30" fill="#000" opacity="0.6" filter="url(#vl-blur24)"/>
    <defs>
      <radialGradient id="vl-inner" cx="50%" cy="80%" r="60%">
        <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
        <stop offset="0.5" stop-color="#C48A64" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="600" cy="640" rx="260" ry="200" fill="url(#vl-glow)" opacity="0.45"/>
    <!-- glass body -->
    <g filter="url(#vl-shadow)">
      <path d="M470 290 v 430 a 40 40 0 0 0 40 40 h 180 a 40 40 0 0 0 40 -40 v -430 a 30 30 0 0 0 -30 -30 h -200 a 30 30 0 0 0 -30 30 Z" fill="url(#vl-stone)"/>
    </g>
    <!-- liquid, glowing from within -->
    <path d="M476 530 v 190 a 36 36 0 0 0 36 36 h 176 a 36 36 0 0 0 36 -36 v -190 Z" fill="url(#vl-inner)"/>
    <path d="M476 530 v 190 a 36 36 0 0 0 36 36 h 176 a 36 36 0 0 0 36 -36 v -190 Z" fill="#E8C49B" opacity="0.08"/>
    <ellipse cx="600" cy="530" rx="124" ry="8" fill="#F6DDBE" opacity="0.18"/>
    <!-- glass highlight along the key side, and a soft one on the far side -->
    <rect x="492" y="290" width="16" height="420" rx="8" fill="#F3EDE4" opacity="0.14" filter="url(#vl-blur8)"/>
    <rect x="496" y="300" width="5" height="400" rx="3" fill="#F3EDE4" opacity="0.4"/>
    <rect x="690" y="350" width="8" height="310" rx="4" fill="#F3EDE4" opacity="0.08" filter="url(#vl-blur8)"/>
    <!-- neck -->
    <rect x="520" y="240" width="160" height="60" fill="#15120F"/>
    <!-- copper cap -->
    <g filter="url(#vl-softshadow)">
      <rect x="506" y="170" width="188" height="76" rx="12" fill="url(#vl-copper)"/>
    </g>
    <rect x="506" y="184" width="188" height="2" fill="#2A1A10" opacity="0.35"/><rect x="506" y="200" width="188" height="2" fill="#2A1A10" opacity="0.35"/><rect x="506" y="216" width="188" height="2" fill="#2A1A10" opacity="0.35"/><rect x="506" y="232" width="188" height="2" fill="#2A1A10" opacity="0.35"/>
    <rect x="506" y="170" width="188" height="3" rx="1.5" fill="#F6DDBE" opacity="0.85"/>
    <rect x="506" y="170" width="188" height="76" rx="12" fill="#C48A64" opacity="0.25" filter="url(#vl-blur24)"/>
    <rect width="1200" height="900" filter="url(#vl-grain)" opacity="0.9"/>
  </g>
</svg>
