<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Knipsr system flow: QR entry, guest upload, private gallery, durable processing">
  <defs>
    <radialGradient id="kglow" cx="82%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#C48A64" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0C0C0C"/>
  <rect width="1600" height="1000" fill="url(#kglow)"/>
  <rect x="24" y="24" width="1552" height="952" rx="22" fill="none" stroke="#242424" stroke-width="2"/>

  <text x="96" y="118" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="18" letter-spacing="4" fill="#C48A64">CASE STUDY</text>
  <text x="96" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="56" font-weight="700" fill="#EDEDED">Knipsr</text>
  <text x="98" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" fill="#B6B6B6">Private event media-sharing SaaS</text>

  <!-- flow line -->
  <g stroke="#C48A64" stroke-opacity="0.5" stroke-width="2">
    <line x1="352" y1="560" x2="608" y2="560"/>
    <line x1="712" y1="560" x2="968" y2="560"/>
    <line x1="1072" y1="560" x2="1328" y2="560"/>
  </g>
  <g fill="#C48A64" fill-opacity="0.7">
    <path d="M600 552 L616 560 L600 568 Z"/>
    <path d="M960 552 L976 560 L960 568 Z"/>
    <path d="M1320 552 L1336 560 L1320 568 Z"/>
  </g>

  <!-- Node 1: QR entry -->
  <circle cx="240" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="240" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(240,560)">
    <g fill="#C48A64">
      <rect x="-34" y="-34" width="16" height="16"/><rect x="-14" y="-34" width="8" height="8"/><rect x="10" y="-34" width="16" height="16"/>
      <rect x="-34" y="-14" width="8" height="8"/><rect x="18" y="-14" width="8" height="8"/>
      <rect x="-34" y="10" width="16" height="16"/><rect x="-10" y="10" width="8" height="8"/><rect x="10" y="10" width="16" height="16"/>
      <rect x="4" y="-8" width="8" height="8"/><rect x="-4" y="6" width="8" height="8"/>
    </g>
  </g>
  <text x="240" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="17" letter-spacing="2" fill="#EDEDED">QR ENTRY</text>
  <text x="240" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">No app, no account</text>

  <!-- Node 2: guest upload -->
  <circle cx="660" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="660" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(660,560)" stroke="#C48A64" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="0" y1="34" x2="0" y2="-24"/>
    <path d="M-20 -4 L0 -28 L20 -4"/>
    <line x1="-30" y1="34" x2="30" y2="34"/>
  </g>
  <text x="660" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="17" letter-spacing="2" fill="#EDEDED">GUEST UPLOAD</text>
  <text x="660" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Photos &amp; video, from any phone</text>

  <!-- Node 3: private gallery -->
  <circle cx="1020" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="1020" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(1020,560)" fill="none" stroke="#C48A64" stroke-width="4">
    <rect x="-36" y="-36" width="30" height="30" rx="6"/>
    <rect x="6" y="-36" width="30" height="30" rx="6"/>
    <rect x="-36" y="6" width="30" height="30" rx="6"/>
    <rect x="6" y="6" width="30" height="30" rx="6"/>
  </g>
  <text x="1020" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="17" letter-spacing="2" fill="#EDEDED">PRIVATE GALLERY</text>
  <text x="1020" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Access controlled, expiring</text>

  <!-- Node 4: durable processing -->
  <circle cx="1440" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="1440" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.5" stroke-width="1.5"/>
  <g transform="translate(1440,560)" fill="none" stroke="#C48A64" stroke-width="5" stroke-linecap="round">
    <path d="M -30 -6 A 32 32 0 1 1 -34 12"/>
    <path d="M -40 -18 L -30 -6 L -16 -14" fill="none"/>
  </g>
  <text x="1440" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="17" letter-spacing="2" fill="#EDEDED">DURABLE PROCESSING</text>
  <text x="1440" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Retry &amp; recovery at scale</text>
</svg>
