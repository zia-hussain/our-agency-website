<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="ln-key" cx="28%" cy="18%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="ln-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ln-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="ln-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="ln-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ln-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="ln-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="ln-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="ln-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="ln-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="ln-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ln-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ln-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ln-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="ln-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="ln-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#ln-clip)">
    <rect width="1200" height="900" fill="url(#ln-key)"/>
    <rect width="1200" height="900" fill="url(#ln-warm)"/>

    <ellipse cx="600" cy="790" rx="400" ry="36" fill="#000" opacity="0.55" filter="url(#ln-blur24)"/>
    
    <g filter="url(#ln-softshadow)">
      <path d="M320 658 q 0 -18 18 -18 h 524 q 18 0 18 18 v 50 q 0 18 -18 18 h -524 q -18 0 -18 -18 Z" fill="url(#ln-stone)"/>
    </g>
    <path d="M320 658 q 0 -18 18 -18 h 524 q 18 0 18 18 v 50 q 0 18 -18 18 h -524 q -18 0 -18 -18 Z" fill="#000" opacity="0.25"/>
    <!-- fold line: the top edge catches the key -->
    <path d="M338 641 h 524" stroke="#F3EDE4" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
    <path d="M380 704 q 220 -14 440 0" stroke="#000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <!-- the fold: a soft rolled edge on the right -->
    <path d="M820 646 q 60 37 0 74" stroke="#000" stroke-opacity="0.25" stroke-width="12" fill="none" filter="url(#ln-blur8)"/>
    <g filter="url(#ln-softshadow)">
      <path d="M330 578 q 0 -18 18 -18 h 504 q 18 0 18 18 v 50 q 0 18 -18 18 h -504 q -18 0 -18 -18 Z" fill="url(#ln-stone)"/>
    </g>
    <path d="M330 578 q 0 -18 18 -18 h 504 q 18 0 18 18 v 50 q 0 18 -18 18 h -504 q -18 0 -18 -18 Z" fill="#000" opacity="0.18"/>
    <!-- fold line: the top edge catches the key -->
    <path d="M348 561 h 504" stroke="#F3EDE4" stroke-opacity="0.24" stroke-width="3" stroke-linecap="round"/>
    <path d="M390 624 q 210 -14 420 0" stroke="#000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <!-- the fold: a soft rolled edge on the right -->
    <path d="M810 566 q 60 37 0 74" stroke="#000" stroke-opacity="0.25" stroke-width="12" fill="none" filter="url(#ln-blur8)"/>
    <g filter="url(#ln-softshadow)">
      <path d="M315 498 q 0 -18 18 -18 h 534 q 18 0 18 18 v 50 q 0 18 -18 18 h -534 q -18 0 -18 -18 Z" fill="url(#ln-stone)"/>
    </g>
    <path d="M315 498 q 0 -18 18 -18 h 534 q 18 0 18 18 v 50 q 0 18 -18 18 h -534 q -18 0 -18 -18 Z" fill="#000" opacity="0.11"/>
    <!-- fold line: the top edge catches the key -->
    <path d="M333 481 h 534" stroke="#F3EDE4" stroke-opacity="0.20" stroke-width="3" stroke-linecap="round"/>
    <path d="M375 544 q 225 -14 450 0" stroke="#000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <!-- the fold: a soft rolled edge on the right -->
    <path d="M825 486 q 60 37 0 74" stroke="#000" stroke-opacity="0.25" stroke-width="12" fill="none" filter="url(#ln-blur8)"/>
    <g filter="url(#ln-softshadow)">
      <path d="M335 418 q 0 -18 18 -18 h 494 q 18 0 18 18 v 50 q 0 18 -18 18 h -494 q -18 0 -18 -18 Z" fill="url(#ln-stone)"/>
    </g>
    <path d="M335 418 q 0 -18 18 -18 h 494 q 18 0 18 18 v 50 q 0 18 -18 18 h -494 q -18 0 -18 -18 Z" fill="#000" opacity="0.04"/>
    <!-- fold line: the top edge catches the key -->
    <path d="M353 401 h 494" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
    <path d="M395 464 q 205 -14 410 0" stroke="#000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <!-- the fold: a soft rolled edge on the right -->
    <path d="M805 406 q 60 37 0 74" stroke="#000" stroke-opacity="0.25" stroke-width="12" fill="none" filter="url(#ln-blur8)"/>
    <!-- the copper band around the whole stack -->
    <rect x="520" y="370" width="150" height="380" rx="14" fill="#C48A64" opacity="0.3" filter="url(#ln-blur24)"/>
    <g filter="url(#ln-softshadow)">
      <path d="M548 404 h 104 v 320 h -104 Z" fill="url(#ln-copperV)"/>
      <path d="M548 404 q 52 -30 104 0 v 16 q -52 -24 -104 0 Z" fill="#F0D2AE"/>
    </g>
    <rect x="552" y="420" width="3" height="300" fill="#F6DDBE" opacity="0.8"/>
    <rect x="645" y="420" width="4" height="300" fill="#2A1A10" opacity="0.45"/>
    <!-- the band's small clasp -->
    <rect x="574" y="548" width="52" height="30" rx="6" fill="url(#ln-copper)"/>
    <rect x="574" y="548" width="52" height="3" fill="#F6DDBE" opacity="0.9"/>
    <rect width="1200" height="900" filter="url(#ln-grain)" opacity="0.9"/>
  </g>
</svg>
