<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/Logo%20Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get("view") !== "proposal") return;

          var robots = document.createElement("meta");
          robots.name = "robots";
          robots.content = "noindex, nofollow";
          document.head.appendChild(robots);

          var googlebot = document.createElement("meta");
          googlebot.name = "googlebot";
          googlebot.content = "noindex, nofollow";
          document.head.appendChild(googlebot);
        } catch (error) {
          // Keep proposal pages usable even if URLSearchParams is unavailable.
        }
      })();
    </script>
    <!-- route-meta:start -->
    <meta
      name="description"
      content="Forge Clear Ideas Into Shipped Software. Zumetrix Labs builds SaaS MVPs, React/Node.js applications, AI automation, and mobile apps for founders who need thinking partners. Founded by Zia Hussain and Omer Gillani."
    />
    <meta name="author" content="Zumetrix Labs" />
    <meta
      property="og:title"
      content="Zumetrix Labs | SaaS MVPs, Apps & AI Automation"
    />
    <meta
      property="og:description"
      content="Forge Clear Ideas Into Shipped Software. SaaS MVPs, React/Node.js applications, AI automation, and mobile apps for founders who need thinking partners."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zumetrix.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Zumetrix Labs | SaaS MVPs, Apps & AI Automation"
    />
    <meta
      name="twitter:description"
      content="Forge Clear Ideas Into Shipped Software. SaaS MVPs, AI automation, and mobile apps for founders who need thinking partners."
    />
    <link rel="canonical" href="https://zumetrix.com" />
    <title>Zumetrix Labs | SaaS MVPs, Apps & AI Automation</title>
    <!-- route-meta:end -->
    <!-- Organization JSON-LD lives only in HomePage.tsx's structuredData now.
         This file used to ship a second, slightly different Organization
         block (different logo shape, an extra address field, a shorter
         sameAs list) unconditionally on every route — including the home
         page, which already declares its own. Two conflicting definitions
         of the same @id on one document is worse than one correct one. -->
    <script type="text/javascript">
      window.addEventListener("load", function () {
        var loadClarity = function () {
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "p5j8k9m0n1");
        };

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadClarity, { timeout: 4000 });
        } else {
          window.setTimeout(loadClarity, 2000);
        }
      }, { once: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
