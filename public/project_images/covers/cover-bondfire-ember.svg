<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="em-key" cx="30%" cy="20%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="em-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="em-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="em-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="em-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="em-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="em-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="em-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="em-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="em-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="em-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="em-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="em-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="em-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="em-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="em-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#em-clip)">
    <rect width="1200" height="900" fill="url(#em-key)"/>
    <rect width="1200" height="900" fill="url(#em-warm)"/>

    <ellipse cx="600" cy="760" rx="440" ry="40" fill="#000" opacity="0.5" filter="url(#em-blur24)"/>
    <!-- the ember's light on the ground, under the charcoal -->
    <ellipse cx="600" cy="580" rx="340" ry="120" fill="#C48A64" opacity="0.2" filter="url(#em-blur24)"/>
    <!-- cold charcoal, scattered and dark; the faces toward the ember catch its light -->
    <g transform="rotate(-8 340 610)"><path d="M190 610 L240 555 L415 560 L490 596.25 L440 665 L265 662.3809523809524 Z" fill="url(#em-stone)"/><path d="M190 610 L240 555 L415 560 L490 596.25 L440 665 L265 662.3809523809524 Z" fill="#000" opacity="0.45"/><path d="M190 610 L240 555 L415 560" stroke="#C48A64" stroke-opacity="0.45" stroke-width="2.5" fill="none"/><path d="M415 560 L490 596.25" stroke="#F3EDE4" stroke-opacity="0.1" stroke-width="2.5" fill="none"/></g>
    <g transform="rotate(6 880 600)"><path d="M740 600 L786.6666666666666 550 L950 554.5454545454545 L1020 587.5 L973.3333333333334 650 L810 647.6190476190476 Z" fill="url(#em-stone)"/><path d="M740 600 L786.6666666666666 550 L950 554.5454545454545 L1020 587.5 L973.3333333333334 650 L810 647.6190476190476 Z" fill="#000" opacity="0.5"/><path d="M740 600 L786.6666666666666 550 L950 554.5454545454545" stroke="#F3EDE4" stroke-opacity="0.14" stroke-width="2.5" fill="none"/><path d="M950 554.5454545454545 L1020 587.5" stroke="#C48A64" stroke-opacity="0.45" stroke-width="2.5" fill="none"/></g>
    <g transform="rotate(3 560 670)"><path d="M380 670 L440 622 L650 626.3636363636364 L740 658 L680 718 L470 715.7142857142857 Z" fill="url(#em-stone)"/><path d="M380 670 L440 622 L650 626.3636363636364 L740 658 L680 718 L470 715.7142857142857 Z" fill="#000" opacity="0.35"/><path d="M380 670 L440 622 L650 626.3636363636364" stroke="#C48A64" stroke-opacity="0.45" stroke-width="2.5" fill="none"/><path d="M650 626.3636363636364 L740 658" stroke="#F3EDE4" stroke-opacity="0.1" stroke-width="2.5" fill="none"/></g>
    <g transform="rotate(-14 770 530)"><path d="M660 530 L696.6666666666666 490 L825 493.6363636363636 L880 520 L843.3333333333334 570 L715 568.0952380952381 Z" fill="url(#em-stone)"/><path d="M660 530 L696.6666666666666 490 L825 493.6363636363636 L880 520 L843.3333333333334 570 L715 568.0952380952381 Z" fill="#000" opacity="0.55"/><path d="M660 530 L696.6666666666666 490 L825 493.6363636363636" stroke="#F3EDE4" stroke-opacity="0.14" stroke-width="2.5" fill="none"/><path d="M825 493.6363636363636 L880 520" stroke="#C48A64" stroke-opacity="0.45" stroke-width="2.5" fill="none"/></g>
    <g transform="rotate(12 430 530)"><path d="M330 530 L363.3333333333333 488 L480 491.8181818181818 L530 519.5 L496.6666666666667 572 L380 570 Z" fill="url(#em-stone)"/><path d="M330 530 L363.3333333333333 488 L480 491.8181818181818 L530 519.5 L496.6666666666667 572 L380 570 Z" fill="#000" opacity="0.55"/><path d="M330 530 L363.3333333333333 488 L480 491.8181818181818" stroke="#C48A64" stroke-opacity="0.45" stroke-width="2.5" fill="none"/><path d="M480 491.8181818181818 L530 519.5" stroke="#F3EDE4" stroke-opacity="0.1" stroke-width="2.5" fill="none"/></g>
    <ellipse cx="600" cy="540" rx="200" ry="60" fill="#C48A64" opacity="0.22" filter="url(#em-blur24)"/>
    <circle cx="600" cy="470" r="300" fill="url(#em-glow)" opacity="0.8"/>
    <!-- the ember: lit from inside, charred on the far side -->
    <circle cx="600" cy="470" r="138" fill="#E8C49B" opacity="0.3" filter="url(#em-blur24)"/>
    <g filter="url(#em-softshadow)"><circle cx="600" cy="470" r="78" fill="url(#em-sphere)"/></g>
    <defs><clipPath id="em-ember"><circle cx="600" cy="470" r="78"/></clipPath></defs>
    <g clip-path="url(#em-ember)"><ellipse cx="654" cy="480" rx="58.5" ry="85.80000000000001" fill="#1A120C" opacity="0.85" filter="url(#em-blur8)"/></g>
    <path d="M582 418 q -12 30 6 54 q 10 14 4 36" stroke="#4A2A18" stroke-opacity="0.7" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M554 478 q 22 4 36 18" stroke="#4A2A18" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="572" cy="444" r="16" fill="#FFF4E6" opacity="0.8" filter="url(#em-blur8)"/>
    <rect width="1200" height="900" filter="url(#em-grain)" opacity="0.9"/>
  </g>
</svg>
