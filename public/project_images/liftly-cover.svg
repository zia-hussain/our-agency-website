<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Liftly system flow: pickup and dropoff, serviceability radius, booking and deposit, operations">
  <defs>
    <radialGradient id="lglow" cx="82%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#C48A64" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0C0C0C"/>
  <rect width="1600" height="1000" fill="url(#lglow)"/>
  <rect x="24" y="24" width="1552" height="952" rx="22" fill="none" stroke="#242424" stroke-width="2"/>

  <text x="96" y="118" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="18" letter-spacing="4" fill="#C48A64">CASE STUDY</text>
  <text x="96" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="56" font-weight="700" fill="#EDEDED">Liftly</text>
  <text x="98" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" fill="#B6B6B6">Operational booking platform — V1 foundation</text>

  <g stroke="#C48A64" stroke-opacity="0.5" stroke-width="2">
    <line x1="352" y1="560" x2="608" y2="560"/>
    <line x1="712" y1="560" x2="968" y2="560"/>
    <line x1="1072" y1="560" x2="1328" y2="560"/>
  </g>
  <g fill="#C48A64" fill-opacity="0.7">
    <path d="M600 552 L616 560 L600 568 Z"/>
    <path d="M960 552 L976 560 L960 568 Z"/>
    <path d="M1320 552 L1336 560 L1320 568 Z"/>
  </g>

  <!-- Node 1: pickup -> dropoff -->
  <circle cx="240" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="240" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(240,560)">
    <path d="M-34 8 Q0 -46 34 8" fill="none" stroke="#C48A64" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <circle cx="-34" cy="8" r="7" fill="#C48A64"/>
    <circle cx="34" cy="8" r="7" fill="none" stroke="#C48A64" stroke-width="3"/>
  </g>
  <text x="240" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="16" letter-spacing="1.5" fill="#EDEDED">PICKUP &#8594; DROPOFF</text>
  <text x="240" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Job &amp; item details captured</text>

  <!-- Node 2: serviceability radius -->
  <circle cx="660" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="660" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(660,560)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#C48A64" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.8"/>
    <circle cx="0" cy="4" r="6" fill="#C48A64"/>
    <path d="M0 -30 L0 -14" stroke="#C48A64" stroke-width="2"/>
  </g>
  <text x="660" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="16" letter-spacing="1.5" fill="#EDEDED">SERVICEABILITY</text>
  <text x="660" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Distance &amp; eligibility logic</text>

  <!-- Node 3: booking + deposit -->
  <circle cx="1020" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="1020" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(1020,560)">
    <rect x="-34" y="-30" width="46" height="40" rx="5" fill="none" stroke="#C48A64" stroke-width="3"/>
    <line x1="-34" y1="-16" x2="12" y2="-16" stroke="#C48A64" stroke-width="2"/>
    <circle cx="20" cy="20" r="18" fill="#0C0C0C" stroke="#C48A64" stroke-width="3"/>
    <text x="20" y="26" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#C48A64">$</text>
  </g>
  <text x="1020" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="16" letter-spacing="1.5" fill="#EDEDED">BOOKING + DEPOSIT</text>
  <text x="1020" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Payment handled up front</text>

  <!-- Node 4: operations -->
  <circle cx="1440" cy="560" r="112" fill="#131313" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="1440" cy="560" r="112" fill="none" stroke="#C48A64" stroke-opacity="0.5" stroke-width="1.5"/>
  <g transform="translate(1440,560)" fill="none" stroke="#C48A64" stroke-width="3">
    <rect x="-36" y="-32" width="72" height="16" rx="3"/>
    <rect x="-36" y="-8" width="46" height="16" rx="3"/>
    <rect x="-36" y="16" width="60" height="16" rx="3"/>
  </g>
  <text x="1440" y="704" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="17" letter-spacing="2" fill="#EDEDED">OPERATIONS</text>
  <text x="1440" y="730" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#74716E">Internal admin controls</text>

  <!-- V2 note -->
  <text x="96" y="880" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="15" letter-spacing="1.5" fill="#5A564F">V1 SHOWN ABOVE &#183; PRICING ENGINE V2 DESIGNED, NOT YET BUILT</text>
</svg>
