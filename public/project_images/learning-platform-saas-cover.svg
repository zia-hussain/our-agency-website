<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Anonymized case study: a tangled, unclear system stabilized into an organized, clear one">
  <defs>
    <radialGradient id="pglow" cx="18%" cy="86%" r="60%">
      <stop offset="0%" stop-color="#C48A64" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0C0C0C"/>
  <rect width="1600" height="1000" fill="url(#pglow)"/>
  <rect x="24" y="24" width="1552" height="952" rx="22" fill="none" stroke="#242424" stroke-width="2"/>

  <text x="96" y="118" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="18" letter-spacing="4" fill="#C48A64">CASE STUDY &#183; ANONYMIZED</text>
  <text x="96" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="42" font-weight="700" fill="#EDEDED">Learning Platform SaaS</text>
  <text x="98" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" fill="#B6B6B6">Client identity withheld &#183; stabilization &amp; technical clarity engagement</text>

  <!-- LEFT: tangled / unclear state -->
  <g opacity="0.85">
    <g stroke="#6B5A47" stroke-width="1.5" fill="none">
      <path d="M240 430 L460 520" stroke-dasharray="3 6"/>
      <path d="M460 520 L330 640"/>
      <path d="M330 640 L560 700" stroke-dasharray="3 6"/>
      <path d="M560 700 L510 460"/>
      <path d="M510 460 L240 430"/>
      <path d="M330 640 L240 430" stroke-dasharray="2 7"/>
    </g>
    <g>
      <circle cx="240" cy="430" r="15" fill="#131313" stroke="#8A7660" stroke-width="2"/>
      <circle cx="510" cy="460" r="15" fill="#131313" stroke="#8A7660" stroke-width="2"/>
      <circle cx="330" cy="640" r="15" fill="#131313" stroke="#8A7660" stroke-width="2"/>
      <circle cx="560" cy="700" r="15" fill="#131313" stroke="#8A7660" stroke-width="2"/>
      <circle cx="460" cy="520" r="15" fill="#131313" stroke="#8A7660" stroke-width="2"/>
    </g>
  </g>
  <text x="390" y="800" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="15" letter-spacing="2" fill="#6B5A47">FRONTEND &#183; API &#183; DATABASE &#183; MESSAGING &#183; AUTOMATION</text>
  <text x="390" y="826" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#5A564F">unclear which was broken, unfinished, or intentional</text>

  <!-- transition -->
  <g transform="translate(800,540)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#C48A64" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M56 -10 L74 0 L56 10" fill="none" stroke="#C48A64" stroke-width="2" stroke-opacity="0.6"/>
  </g>
  <text x="800" y="500" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="15" letter-spacing="3" fill="#C48A64">STABILIZED</text>

  <!-- RIGHT: organized / clear state -->
  <g>
    <line x1="1230" y1="410" x2="1230" y2="690" stroke="#C48A64" stroke-width="2" stroke-opacity="0.55"/>
    <g fill="#131313" stroke="#C48A64" stroke-width="2.5">
      <rect x="1204" y="396" width="52" height="28" rx="6"/>
      <rect x="1204" y="466" width="52" height="28" rx="6"/>
      <rect x="1204" y="536" width="52" height="28" rx="6"/>
      <rect x="1204" y="606" width="52" height="28" rx="6"/>
      <rect x="1204" y="676" width="52" height="28" rx="6"/>
    </g>
  </g>
  <text x="1230" y="800" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',monospace" font-size="15" letter-spacing="2" fill="#EDEDED">ONE ALIGNED SYSTEM</text>
  <text x="1230" y="826" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#B6B6B6">bugs fixed, scope categorized, handed off clearly</text>
</svg>
