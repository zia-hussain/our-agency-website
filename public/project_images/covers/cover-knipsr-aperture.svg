<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="ap-key" cx="28%" cy="18%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="ap-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="ap-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="ap-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ap-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="ap-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="ap-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="ap-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="ap-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="ap-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ap-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ap-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ap-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="ap-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="ap-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#ap-clip)">
    <rect width="1200" height="900" fill="url(#ap-key)"/>
    <rect width="1200" height="900" fill="url(#ap-warm)"/>

    <ellipse cx="600" cy="820" rx="380" ry="30" fill="#000" opacity="0.55" filter="url(#ap-blur24)"/>
    <!-- barrel -->
    <g filter="url(#ap-shadow)"><circle cx="600" cy="450" r="376" fill="url(#ap-stone2)"/></g>
    <circle cx="600" cy="450" r="376" fill="none" stroke="url(#ap-edge)" stroke-width="3"/>
    <circle cx="600" cy="450" r="338" fill="#0B0A09"/>
    <!-- light coming through the opening -->
    <circle cx="600" cy="450" r="172" fill="url(#ap-glow)"/>
    <circle cx="600" cy="450" r="112" fill="#E8C49B" opacity="0.22" filter="url(#ap-blur24)"/>
    <!-- blades in sequence; the copper one is overlapped by its neighbour like any other -->
    
    <g filter="url(#ap-softshadow)">
      <path d="M600 338 L896.6 305.3 A330 330 0 0 0 509 132.8 Z" fill="url(#ap-stone)"/>
      <path d="M600 338 L896.6 305.3 A330 330 0 0 0 509 132.8 Z" fill="#000" opacity="0.170"/>
    </g>
    <line x1="600" y1="338" x2="896.6" y2="305.3" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M679.2 370.8 L912 557.4 A330 330 0 0 0 760 161.4 Z" fill="url(#ap-stone)"/>
      <path d="M679.2 370.8 L912 557.4 A330 330 0 0 0 760 161.4 Z" fill="#000" opacity="0.215"/>
    </g>
    <line x1="679.2" y1="370.8" x2="912" y2="557.4" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M712 450 L744.7 746.6 A330 330 0 0 0 917.2 359 Z" fill="url(#ap-stone)"/>
      <path d="M712 450 L744.7 746.6 A330 330 0 0 0 917.2 359 Z" fill="#000" opacity="0.260"/>
    </g>
    <line x1="712" y1="450" x2="744.7" y2="746.6" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M679.2 529.2 L492.6 762 A330 330 0 0 0 888.6 610 Z" fill="url(#ap-stone)"/>
      <path d="M679.2 529.2 L492.6 762 A330 330 0 0 0 888.6 610 Z" fill="#000" opacity="0.305"/>
    </g>
    <line x1="679.2" y1="529.2" x2="492.6" y2="762" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M600 562 L303.4 594.7 A330 330 0 0 0 691 767.2 Z" fill="url(#ap-stone)"/>
      <path d="M600 562 L303.4 594.7 A330 330 0 0 0 691 767.2 Z" fill="#000" opacity="0.350"/>
    </g>
    <line x1="600" y1="562" x2="303.4" y2="594.7" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M520.8 529.2 L288 342.6 A330 330 0 0 0 440 738.6 Z" fill="url(#ap-stone)"/>
      <path d="M520.8 529.2 L288 342.6 A330 330 0 0 0 440 738.6 Z" fill="#000" opacity="0.395"/>
    </g>
    <line x1="520.8" y1="529.2" x2="288" y2="342.6" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <g filter="url(#ap-softshadow)">
      <path d="M488 450 L455.3 153.4 A330 330 0 0 0 282.8 541 Z" fill="url(#ap-copper)"/>
      
    </g>
    <line x1="488" y1="450" x2="455.3" y2="153.4" stroke="#F6DDBE" stroke-opacity="0.85" stroke-width="3"/>
    <g filter="url(#ap-softshadow)">
      <path d="M520.8 370.8 L707.4 138 A330 330 0 0 0 311.4 290 Z" fill="url(#ap-stone)"/>
      <path d="M520.8 370.8 L707.4 138 A330 330 0 0 0 311.4 290 Z" fill="#000" opacity="0.125"/>
    </g>
    <line x1="520.8" y1="370.8" x2="707.4" y2="138" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    
    <g filter="url(#ap-softshadow)">
      <path d="M520.8 370.8 L707.4 138 A330 330 0 0 0 311.4 290 Z" fill="url(#ap-stone)"/>
      <path d="M520.8 370.8 L707.4 138 A330 330 0 0 0 311.4 290 Z" fill="#000" opacity="0.125"/>
    </g>
    <line x1="520.8" y1="370.8" x2="707.4" y2="138" stroke="#F3EDE4" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="600" cy="450" r="106" fill="#070605"/>
    <circle cx="600" cy="450" r="106" fill="url(#ap-glow)" opacity="0.7"/>
    <circle cx="600" cy="450" r="72" fill="#E8C49B" opacity="0.35" filter="url(#ap-blur24)"/>
    <!-- rim highlight on the key side -->
    <path d="M246.7 321.4 A376 376 0 0 1 728.6 96.7" stroke="#F3EDE4" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect width="1200" height="900" filter="url(#ap-grain)" opacity="0.9"/>
  </g>
</svg>
