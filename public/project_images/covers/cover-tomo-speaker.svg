<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="sp-key" cx="28%" cy="18%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="sp-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="sp-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="sp-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sp-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="sp-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="sp-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="sp-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="sp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="sp-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sp-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sp-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="sp-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="sp-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="sp-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#sp-clip)">
    <rect width="1200" height="900" fill="url(#sp-key)"/>
    <rect width="1200" height="900" fill="url(#sp-warm)"/>

    <ellipse cx="600" cy="820" rx="380" ry="30" fill="#000" opacity="0.55" filter="url(#sp-blur24)"/>
    <defs>
      <radialGradient id="sp-cone" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#0B0A09"/>
        <stop offset="0.3" stop-color="#15120F"/>
        <stop offset="0.75" stop-color="#2A241F"/>
        <stop offset="1" stop-color="#3A332D"/>
      </radialGradient>
      <linearGradient id="sp-shade" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.08"/>
        <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <!-- frame -->
    <g filter="url(#sp-shadow)"><circle cx="600" cy="450" r="350" fill="url(#sp-stone2)"/></g>
    <circle cx="600" cy="450" r="350" fill="none" stroke="url(#sp-edge)" stroke-width="3"/>
    <!-- surround (the soft rubber ring) -->
    <circle cx="600" cy="450" r="316" fill="#0E0C0A"/>
    <circle cx="600" cy="450" r="298" fill="none" stroke="#2A241F" stroke-width="28"/>
    <circle cx="600" cy="450" r="298" fill="none" stroke="url(#sp-shade)" stroke-width="28"/>
    <!-- cone -->
    <circle cx="600" cy="450" r="280" fill="url(#sp-cone)"/>
    <circle cx="600" cy="450" r="280" fill="url(#sp-shade)"/>
    <circle cx="600" cy="450" r="218" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/><circle cx="600" cy="450" r="216" fill="none" stroke="#F3EDE4" stroke-opacity="0.05" stroke-width="1.5"/><circle cx="600" cy="450" r="174" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/><circle cx="600" cy="450" r="172" fill="none" stroke="#F3EDE4" stroke-opacity="0.05" stroke-width="1.5"/><circle cx="600" cy="450" r="132" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/><circle cx="600" cy="450" r="130" fill="none" stroke="#F3EDE4" stroke-opacity="0.05" stroke-width="1.5"/>
    <!-- the copper ring: the one voice -->
    <circle cx="600" cy="450" r="200" fill="none" stroke="#C48A64" stroke-opacity="0.4" stroke-width="40" filter="url(#sp-blur24)"/>
    <circle cx="600" cy="450" r="200" fill="none" stroke="url(#sp-copper)" stroke-width="16"/>
    <path d="M412.1 518.4 A200 200 0 0 1 531.6 262.1" stroke="#F6DDBE" stroke-opacity="0.85" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(-3,-3)"/>
    <!-- dust cap -->
    <circle cx="600" cy="450" r="96" fill="url(#sp-darkSphere)"/>
    <ellipse cx="570" cy="414" rx="26" ry="16" fill="#F3EDE4" opacity="0.14" filter="url(#sp-blur8)"/>
    <!-- key light grazing the frame's upper-left -->
    <path d="M261.9 359.4 A350 350 0 0 1 690.6 111.9" stroke="#F3EDE4" stroke-opacity="0.32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect width="1200" height="900" filter="url(#sp-grain)" opacity="0.9"/>
  </g>
</svg>
