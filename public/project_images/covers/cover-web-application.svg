<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="w-key" cx="30%" cy="22%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="w-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="w-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="w-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="w-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="w-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="w-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="w-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="w-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="w-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="w-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="w-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="w-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="w-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#w-clip)">
    <rect width="1200" height="900" fill="url(#w-key)"/>
    <rect width="1200" height="900" fill="url(#w-warm)"/>

    <ellipse cx="600" cy="800" rx="400" ry="34" fill="#000" opacity="0.5" filter="url(#w-blur24)"/>
    <g filter="url(#w-shadow)">
      <rect x="260" y="180" width="680" height="560" rx="14" fill="url(#w-stone)"/>
    </g>
    <rect x="260" y="180" width="680" height="560" rx="14" fill="none" stroke="url(#w-edge)" stroke-width="2"/>
    <!-- grooves -->
    
      <rect x="300" y="250" width="600" height="44" rx="6" fill="#0B0A09" opacity="0.75"/>
      <rect x="300" y="293" width="600" height="1.5" fill="#F3EDE4" opacity="0.07"/>
      <rect x="318" y="266" width="270" height="10" rx="5" fill="#F3EDE4" opacity="0.06"/>
      <rect x="670" y="266" width="70" height="10" rx="5" fill="#F3EDE4" opacity="0.05"/>
      <rect x="300" y="330" width="600" height="44" rx="6" fill="#0B0A09" opacity="0.75"/>
      <rect x="300" y="373" width="600" height="1.5" fill="#F3EDE4" opacity="0.07"/>
      <rect x="318" y="346" width="190" height="10" rx="5" fill="#F3EDE4" opacity="0.06"/>
      <rect x="670" y="346" width="70" height="10" rx="5" fill="#F3EDE4" opacity="0.05"/>
      <rect x="300" y="490" width="600" height="44" rx="6" fill="#0B0A09" opacity="0.75"/>
      <rect x="300" y="533" width="600" height="1.5" fill="#F3EDE4" opacity="0.07"/>
      <rect x="318" y="506" width="190" height="10" rx="5" fill="#F3EDE4" opacity="0.06"/>
      <rect x="670" y="506" width="70" height="10" rx="5" fill="#F3EDE4" opacity="0.05"/>
      <rect x="300" y="570" width="600" height="44" rx="6" fill="#0B0A09" opacity="0.75"/>
      <rect x="300" y="613" width="600" height="1.5" fill="#F3EDE4" opacity="0.07"/>
      <rect x="318" y="586" width="270" height="10" rx="5" fill="#F3EDE4" opacity="0.06"/>
      <rect x="670" y="586" width="70" height="10" rx="5" fill="#F3EDE4" opacity="0.05"/>
      <rect x="300" y="650" width="600" height="44" rx="6" fill="#0B0A09" opacity="0.75"/>
      <rect x="300" y="693" width="600" height="1.5" fill="#F3EDE4" opacity="0.07"/>
      <rect x="318" y="666" width="190" height="10" rx="5" fill="#F3EDE4" opacity="0.06"/>
      <rect x="670" y="666" width="70" height="10" rx="5" fill="#F3EDE4" opacity="0.05"/>
    <!-- the raised copper row -->
    <rect x="300" y="400" width="600" height="64" rx="8" fill="#C48A64" opacity="0.35" filter="url(#w-blur24)"/>
    <g filter="url(#w-shadow)">
      <rect x="292" y="396" width="616" height="58" rx="8" fill="url(#w-copper)"/>
    </g>
    <rect x="292" y="396" width="616" height="2" rx="1" fill="#F6DDBE" opacity="0.8"/>
    <rect x="316" y="418" width="150" height="12" rx="6" fill="#2A1A10" opacity="0.55"/>
    <rect x="700" y="418" width="60" height="12" rx="6" fill="#2A1A10" opacity="0.45"/>
    <rect x="800" y="418" width="84" height="12" rx="6" fill="#2A1A10" opacity="0.45"/>
    <rect width="1200" height="900" filter="url(#w-grain)" opacity="0.9"/>
  </g>
</svg>
