<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

  <defs>
    <radialGradient id="fn-key" cx="35%" cy="20%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="fn-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fn-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="fn-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="fn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fn-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="fn-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="fn-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="fn-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="fn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="fn-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fn-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fn-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="fn-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="fn-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="fn-clip"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#fn-clip)">
    <rect width="1600" height="900" fill="url(#fn-key)"/>
    <rect width="1600" height="900" fill="url(#fn-warm)"/>

    <ellipse cx="800" cy="720" rx="420" ry="40" fill="#000" opacity="0.55" filter="url(#fn-blur24)"/>
    <!-- page block -->
    <g filter="url(#fn-shadow)">
      <path d="M520 300 L1100 300 L1100 650 L520 650 Z" fill="#1A1613"/>
    </g>
    <rect x="1100" y="304" width="14" height="1.6" fill="#F3EDE4" opacity="0.22"/><rect x="1100" y="323" width="11" height="1.6" fill="#F3EDE4" opacity="0.19"/><rect x="1100" y="342" width="8" height="1.6" fill="#F3EDE4" opacity="0.16"/><rect x="1100" y="361" width="14" height="1.6" fill="#F3EDE4" opacity="0.13"/><rect x="1100" y="380" width="11" height="1.6" fill="#F3EDE4" opacity="0.22"/><rect x="1100" y="399" width="8" height="1.6" fill="#F3EDE4" opacity="0.19"/><rect x="1100" y="418" width="14" height="1.6" fill="#F3EDE4" opacity="0.16"/><rect x="1100" y="437" width="11" height="1.6" fill="#F3EDE4" opacity="0.13"/><rect x="1100" y="456" width="8" height="1.6" fill="#F3EDE4" opacity="0.22"/><rect x="1100" y="475" width="14" height="1.6" fill="#F3EDE4" opacity="0.19"/><rect x="1100" y="494" width="11" height="1.6" fill="#F3EDE4" opacity="0.16"/><rect x="1100" y="513" width="8" height="1.6" fill="#F3EDE4" opacity="0.13"/><rect x="1100" y="532" width="14" height="1.6" fill="#F3EDE4" opacity="0.22"/><rect x="1100" y="551" width="11" height="1.6" fill="#F3EDE4" opacity="0.19"/><rect x="1100" y="570" width="8" height="1.6" fill="#F3EDE4" opacity="0.16"/><rect x="1100" y="589" width="14" height="1.6" fill="#F3EDE4" opacity="0.13"/><rect x="1100" y="608" width="11" height="1.6" fill="#F3EDE4" opacity="0.22"/><rect x="1100" y="627" width="8" height="1.6" fill="#F3EDE4" opacity="0.19"/>
    <rect x="520" y="650" width="580" height="6" fill="#F3EDE4" opacity="0.07"/>
    <!-- cover, slightly larger than the pages -->
    <g filter="url(#fn-softshadow)">
      <path d="M500 280 L1090 280 L1090 640 L500 640 Z" fill="url(#fn-stone)"/>
    </g>
    <path d="M500 280 L1090 280" stroke="url(#fn-edge)" stroke-width="3"/>
    <rect x="500" y="280" width="36" height="360" fill="#000" opacity="0.28"/>
    <rect x="536" y="280" width="2" height="360" fill="#F3EDE4" opacity="0.06"/>
    <!-- copper ribbon slipping out of the pages -->
    <path d="M980 640 C 985 700, 1010 760, 1060 790" stroke="#C48A64" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.3" filter="url(#fn-blur24)"/>
    <g filter="url(#fn-shadow)">
      <path d="M970 300 L 1000 300 L 1000 650 C 1000 700, 1030 750, 1070 780 L 1046 792 C 1000 756, 968 706, 970 650 Z" fill="url(#fn-copperV)"/>
    </g>
    <path d="M972 302 L 972 650" stroke="#F6DDBE" stroke-opacity="0.6" stroke-width="2"/>
    <rect width="1600" height="900" filter="url(#fn-grain)" opacity="0.9"/>
  </g>
</svg>
