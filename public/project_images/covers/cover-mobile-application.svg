<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <radialGradient id="m-key" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.45" stop-color="#171412"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </radialGradient>
    <radialGradient id="m-warm" cx="38%" cy="40%" r="55%">
      <stop offset="0" stop-color="#C48A64" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A332D"/>
      <stop offset="0.5" stop-color="#211D19"/>
      <stop offset="1" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="m-stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2823"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="m-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE4" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#F3EDE4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F3EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.35" stop-color="#C48A64"/>
      <stop offset="0.75" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#6E4630"/>
    </linearGradient>
    <linearGradient id="m-copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2AE"/>
      <stop offset="0.4" stop-color="#C48A64"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <radialGradient id="m-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#F6DDBE"/>
      <stop offset="0.3" stop-color="#D59C72"/>
      <stop offset="0.7" stop-color="#9A6442"/>
      <stop offset="1" stop-color="#5B3A27"/>
    </radialGradient>
    <radialGradient id="m-darkSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4A423B"/>
      <stop offset="0.4" stop-color="#26211D"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </radialGradient>
    <radialGradient id="m-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C49B" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C48A64" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C48A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="m-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="8" dy="26" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m-softshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="12" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="m-blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="m-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <clipPath id="m-clip"><rect width="1200" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#m-clip)">
    <rect width="1200" height="900" fill="url(#m-key)"/>
    <rect width="1200" height="900" fill="url(#m-warm)"/>

    <ellipse cx="600" cy="760" rx="260" ry="40" fill="#000" opacity="0.6" filter="url(#m-blur24)"/>
    <ellipse cx="600" cy="470" rx="300" ry="300" fill="url(#m-glow)" opacity="0.6"/>
    <g filter="url(#m-shadow)">
      <path d="M600 190 C 760 190, 830 330, 810 480 C 792 630, 700 730, 580 730 C 440 730, 370 610, 380 460 C 390 300, 470 190, 600 190 Z" fill="url(#m-darkSphere)"/>
    </g>
    <!-- copper rim light along the lower-right edge -->
    <path d="M808 440 C 800 600, 706 724, 582 728" stroke="url(#m-copperV)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M808 440 C 800 600, 706 724, 582 728" stroke="#C48A64" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.35" filter="url(#m-blur24)"/>
    <!-- key light on the upper-left shoulder -->
    <ellipse cx="500" cy="300" rx="90" ry="60" fill="#F3EDE4" opacity="0.10" filter="url(#m-blur24)"/>
    <ellipse cx="520" cy="290" rx="34" ry="20" fill="#F3EDE4" opacity="0.18" filter="url(#m-blur8)"/>
    <!-- a single copper dot: the one thing it does -->
    <circle cx="600" cy="470" r="14" fill="url(#m-sphere)"/>
    <circle cx="600" cy="470" r="40" fill="#E8C49B" opacity="0.16" filter="url(#m-blur24)"/>
    <rect width="1200" height="900" filter="url(#m-grain)" opacity="0.9"/>
  </g>
</svg>
